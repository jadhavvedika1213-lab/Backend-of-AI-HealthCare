<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verification Code</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f6f9fc; margin: 0; padding: 20px; color: #333333; }
        .card { max-width: 500px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .header { font-size: 24px; font-weight: bold; color: #1e3a8a; margin-bottom: 20px; text-align: center; }
        .otp { font-size: 32px; font-weight: bold; color: #3b82f6; text-align: center; margin: 30px 0; letter-spacing: 4px; }
        .footer { font-size: 12px; color: #6b7280; text-align: center; margin-top: 30px; border-top: 1px solid #e5e7eb; padding-top: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">AI HealthCare Security</div>
        <p>Hello,</p>
        <p>Your one-time authentication code is below. This code is valid for 5 minutes.</p>
        <div class="otp">{{ otp }}</div>
        <p>If you did not request this code, you can safely ignore this email.</p>
        <div class="footer">
            AI HealthCare Backend Service Team
        </div>
    </div>
</body>
</html>
